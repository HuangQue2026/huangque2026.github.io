<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="title" content="黄雀">
    <meta name="description" content="黄雀 - 专业的在线学习平台">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #ededed;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .course-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            text-align: center;
            padding: 40px 20px 20px;
            line-height: 1.4;
        }

        .btn-wrapper {
            padding: 24px 18px 40px;
            width: 100%;
            text-align: center;
        }

        .read-original-btn {
            display: inline-block;
            background: #07C160;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 50px;
            border-radius: 6px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="courseName" class="course-name"></div>
        <div class="btn-wrapper">
            <a id="readOriginalLink" href="#" class="read-original-btn">阅读原文</a>
        </div>
    </div>

    <script>
        var SALT = 'hq_a_chain_domain_2024';

        function base64Decode(str) {
            var decoded = atob(str);
            var bytes = new Uint8Array(decoded.length);
            for (var i = 0; i < decoded.length; i++) {
                bytes[i] = decoded.charCodeAt(i);
            }
            return bytes;
        }

        function stringToBytes(str) {
            var bytes = new Uint8Array(str.length);
            for (var i = 0; i < str.length; i++) {
                bytes[i] = str.charCodeAt(i);
            }
            return bytes;
        }

        function bytesToString(bytes) {
            return String.fromCharCode.apply(null, bytes);
        }

        function isValidUrl(str) {
            if (!str) return false;
            try {
                var url = new URL(str);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (error) {
                return false;
            }
        }

        function decryptDomain(encryptedDomain) {
            if (!encryptedDomain) {
                return encryptedDomain;
            }

            if (isValidUrl(encryptedDomain)) {
                return encryptedDomain;
            }

            try {
                var decodedBytes = base64Decode(encryptedDomain);
                var saltBytes = stringToBytes(SALT);
                var domainBytes = new Uint8Array(decodedBytes.length);

                for (var i = 0; i < decodedBytes.length; i++) {
                    domainBytes[i] = decodedBytes[i] ^ saltBytes[i % saltBytes.length];
                }

                var decrypted = bytesToString(domainBytes);

                if (isValidUrl(decrypted)) {
                    return decrypted;
                }

                return encryptedDomain;
            } catch (error) {
                return encryptedDomain;
            }
        }

        var params = new URLSearchParams(window.location.search);
        var courseId = params.get('courseId') || '394';
        var userId = params.get('userId') || '265';
        var courseName = params.get('courseName') || '';
        var originalAChainDomain = params.get('aChainDomain') || 'https://shequn.api.huangqueai.com';
        var decryptedAChainDomain = decryptDomain(originalAChainDomain);

        document.getElementById('courseName').textContent = courseName || '课程';

        fetch(decryptedAChainDomain + '/app/abChainDomain/getChainDomain/' + courseId + '/3')
            .then(function(res) { return res.json(); })
            .then(function(response) {
                if (response.code === 200 && response.data && response.data.domainName) {
                    var bChainDomain = decryptDomain(response.data.domainName);
                    var url = bChainDomain + '/home?courseId=' + courseId + '&userId=' + userId + '&aChainDomain=' + encodeURIComponent(originalAChainDomain) + '&courseName=' + encodeURIComponent(courseName);
                    document.getElementById('readOriginalLink').href = url;
                }
            });
    </script>
</body>
</html>
