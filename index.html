<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta property="og:title" content="黄雀">
    <meta property="og:description" content="专业在线学习平台，海量优质课程等你来学">
    <meta property="og:site_name" content="黄雀">
    <meta name="title" content="黄雀">
    <meta name="description" content="专业在线学习平台，海量优质课程等你来学">
    <meta name="keywords" content="在线学习,课程,教育,培训">
    <meta name="apple-mobile-web-app-title" content="黄雀">
    <meta name="application-name" content="黄雀">
    <meta name="theme-color" content="#07C160">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="黄雀">
    <meta name="twitter:description" content="专业在线学习平台，海量优质课程等你来学">
    <title>黄雀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #ededed;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
        }

        .course-name {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            text-align: center;
            padding: 40px 20px 20px;
            line-height: 1.4;
        }

        .loading {
            font-size: 14px;
            color: #999;
            text-align: center;
            padding: 10px;
        }

        .btn-wrapper {
            padding: 24px 18px 40px;
            width: 100%;
            text-align: center;
        }

        .read-original-btn {
            display: inline-block;
            background: #07C160;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 50px;
            border-radius: 6px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="courseName" class="course-name">加载中...</div>
        <div id="loading" class="loading">正在获取课程信息...</div>
        <div id="btnWrapper" class="btn-wrapper" style="display: none;">
            <button id="readOriginalBtn" class="read-original-btn" style="background: #07C160; color: #fff; font-size: 18px; font-weight: 600; padding: 14px 50px; border-radius: 6px; letter-spacing: 2px; border: none; cursor: pointer;">阅读原文</button>
        </div>
    </div>

    <script>
        var SALT = 'hq_a_chain_domain_2024';

        function base64Decode(str) {
            var decoded = atob(str);
            var bytes = new Uint8Array(decoded.length);
            for (var i = 0; i < decoded.length; i++) {
                bytes[i] = decoded.charCodeAt(i);
            }
            return bytes;
        }

        function stringToBytes(str) {
            var bytes = new Uint8Array(str.length);
            for (var i = 0; i < str.length; i++) {
                bytes[i] = str.charCodeAt(i);
            }
            return bytes;
        }

        function bytesToString(bytes) {
            return String.fromCharCode.apply(null, bytes);
        }

        function isValidUrl(str) {
            if (!str) return false;
            try {
                var url = new URL(str);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (error) {
                return false;
            }
        }

        function decryptDomain(encryptedDomain) {
            if (!encryptedDomain) {
                return encryptedDomain;
            }

            if (isValidUrl(encryptedDomain)) {
                return encryptedDomain;
            }

            try {
                var decodedBytes = base64Decode(encryptedDomain);
                var saltBytes = stringToBytes(SALT);
                var domainBytes = new Uint8Array(decodedBytes.length);

                for (var i = 0; i < decodedBytes.length; i++) {
                    domainBytes[i] = decodedBytes[i] ^ saltBytes[i % saltBytes.length];
                }

                var decrypted = bytesToString(domainBytes);

                if (isValidUrl(decrypted)) {
                    return decrypted;
                }

                return encryptedDomain;
            } catch (error) {
                return encryptedDomain;
            }
        }

        function decodeVerifyToken(verifyToken) {
            if (!verifyToken) {
                return null;
            }
            try {
                var normalizedToken = verifyToken
                    .replace(/-/g, '+')
                    .replace(/_/g, '/');
                var padding = (4 - normalizedToken.length % 4) % 4;
                normalizedToken += '='.repeat(padding);

                var binaryStr = atob(normalizedToken);
                var bytes = new Uint8Array(binaryStr.length);
                for (var i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                var decodedToken = new TextDecoder('utf-8').decode(bytes);

                var parts = decodedToken.split('|');
                if (parts.length >= 4) {
                    return {
                        courseId: parseInt(parts[0]),
                        userId: parseInt(parts[1]),
                        encryptDomain: parts[2],
                        title: parts[3]
                    };
                }
            } catch (error) {
                console.warn('verifyToken decode error:', error);
            }
            return null;
        }

        var params = new URLSearchParams(window.location.search);
        var verifyToken = params.get('verifyToken') || '';
        var courseName = '';
        var targetUrl = '';

        function updateCourseName(title) {
            courseName = title || '';
            document.getElementById('courseName').textContent = courseName || '课程';
            if (courseName) {
                document.title = courseName;
                var ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) {
                    ogTitle.setAttribute('content', courseName);
                }
                var nameTitle = document.querySelector('meta[name="title"]');
                if (nameTitle) {
                    nameTitle.setAttribute('content', courseName);
                }
            }
        }

        function handleBtnClick() {
            console.log('Button clicked, navigating to:', targetUrl);
            if (targetUrl) {
                window.location.href = targetUrl;
            }
        }

        function fetchCourseInfo() {
            console.log('fetchCourseInfo called with verifyToken:', verifyToken);
            if (!verifyToken) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btnWrapper').style.display = 'block';
                return;
            }

            var tokenInfo = decodeVerifyToken(verifyToken);
            console.log('Decoded token info:', tokenInfo);

            if (tokenInfo && tokenInfo.title) {
                updateCourseName(tokenInfo.title);
            }

            var decryptedAChainDomain = '';
            if (tokenInfo && tokenInfo.encryptDomain) {
                decryptedAChainDomain = decryptDomain(tokenInfo.encryptDomain);
                console.log('Decrypted AChainDomain:', decryptedAChainDomain);
            } else {
                decryptedAChainDomain = 'https://shequn.api.huangqueai.com';
            }

            if (tokenInfo && tokenInfo.courseId) {
                fetch(decryptedAChainDomain + '/app/abChainDomain/getChainDomain/' + tokenInfo.courseId + '/3')
                    .then(function(res) { return res.json(); })
                    .then(function(response) {
                        console.log('getChainDomain response:', response);
                        if (response.code === 200 && response.data && response.data.domainName) {
                            var bChainDomain = decryptDomain(response.data.domainName);
                            targetUrl = bChainDomain + '/home?verifyToken=' + encodeURIComponent(verifyToken);
                            console.log('Target URL set:', targetUrl);
                        } else {
                            console.log('Invalid response');
                        }
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('btnWrapper').style.display = 'block';
                        console.log('Button shown, waiting for user click...');
                    })
                    .catch(function(err) {
                        console.log('fetchChainDomain error:', err);
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('btnWrapper').style.display = 'block';
                    });
            } else {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('btnWrapper').style.display = 'block';
            }
        }

        document.getElementById('readOriginalBtn').addEventListener('click', handleBtnClick);

        fetchCourseInfo();
    </script>
</body>
</html>
